name: Release
# HACS reads the remote version from the latest GitHub RELEASE's tag. Tags alone
# do not count: without a release, HACS falls back to the first 7 characters of
# the last commit, which cannot be ordered, so the HA update entity has nothing to
# compare and never offers an upgrade. That is exactly what happened to 0.1.1.
#
# The glob is `v*` rather than a version shape on purpose: GitHub's filter is
# glob, not regex, so `v[0-9]+.[0-9]+.[0-9]+` would require literal `+` characters
# and never match v0.1.1. The shape check lives in the step below, where it can
# distinguish "not a release tag" (skip) from "a version that disagrees with the
# manifest" (fail).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish a release for
        required: true
permissions: {contents: write}
jobs:
  # Gate the release on the same job that guards main. Without it a tag could be
  # pushed on a red commit and HACS would offer it to every installation, which is
  # the one direction this pipeline cannot take back.
  #
  # Calling the reusable workflow rather than repeating its steps keeps a single
  # source of truth: a duplicated list would silently stop gating once it drifted.
  verify:
    uses: ./.github/workflows/tests.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      # `actions/checkout` fetches every tag, then FORCE-UPDATES `refs/tags/<tag>` to
      # the resolved commit sha -- replacing the annotated tag object with a lightweight
      # one. Its own log for v0.1.2 shows both steps:
      #
      #   * [new tag]        v0.1.2 -> v0.1.2                       (annotation fetched)
      #   t [tag update]     044221d... -> v0.1.2                   (annotation clobbered)
      #
      # `gh release create --notes-from-tag` reads the ANNOTATION and falls back to the
      # commit message when there is none -- silently. That is how v0.1.2's release got
      # 521 characters of commit message instead of the 6578 characters of release notes
      # written for it. The release was still created, so nothing failed; the notes were
      # simply wrong, and only comparing the published body against the tag revealed it.
      #
      # Re-fetching the tag object restores the annotation. `--force` is needed because
      # the ref was rewritten above.
      - run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if git cat-file -t "refs/tags/$tag" 2>/dev/null | grep -q '^tag$'; then
            echo "$tag is already an annotated tag; nothing to restore"
          else
            git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
            echo "restored the tag object for $tag"
          fi
      - id: guard
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A tag shaped like a release but disagreeing with manifest.json would
          # make HACS advertise a version the code does not claim, and the mismatch
          # is only visible after the upgrade. Fail here instead.
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is not a release tag (expected vX.Y.Z); nothing to publish"
            exit 0
          fi
          manifest="$(python3 -c "import json;print(json.load(open('custom_components/frigate_vision/manifest.json'))['version'])")"
          if [ "${tag#v}" != "$manifest" ]; then
            echo "::error::tag $tag does not match manifest.json version $manifest"
            exit 1
          fi
          # The notes ARE the release. Publishing a commit message under a version tag
          # looks like success and is not, so refuse rather than fall back silently.
          if ! git cat-file -t "refs/tags/$tag" 2>/dev/null | grep -q '^tag$'; then
            echo "::error::$tag is not annotated, so --notes-from-tag would publish the"
            echo "::error::commit message as the release notes. Re-tag it with -a -F."
            exit 1
          fi
          echo "manifest $manifest matches $tag; tag is annotated"
      # Re-pushing a tag, or dispatching by hand for one already released, must not
      # fail the run: `gh release create` errors when the release exists.
      - id: existing
        if: steps.guard.outputs.skip != 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          if gh release view "${{ steps.guard.outputs.tag }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ steps.guard.outputs.tag }} already has a release; nothing to publish"
          fi
      # --notes-from-tag uses the annotated tag's message, which is where this repo
      # writes the release notes. --verify-tag refuses to invent a missing tag.
      - if: steps.guard.outputs.skip != 'true' && steps.existing.outputs.found != 'true'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          gh release create "${{ steps.guard.outputs.tag }}" \
            --verify-tag \
            --title "${{ steps.guard.outputs.tag }}" \
            --notes-from-tag
