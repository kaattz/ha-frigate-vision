name: Tests
# `workflow_call` lets the Release workflow run this same job instead of keeping a
# second copy of the steps. A duplicated list would drift: the release gate would
# go on passing after someone added a check here, which is worse than no gate.
on:
  push:
  pull_request:
  workflow_call:
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.14"}
      - run: pip install homeassistant==2026.8.3 pytest pytest-asyncio pytest-homeassistant-custom-component ruff mypy pillow pyyaml
      - run: python -m pytest -q
        env: {PYTHONPATH: "."}
      - run: ruff check custom_components tests
      - run: mypy custom_components/frigate_vision
      - run: python -m compileall -q custom_components/frigate_vision
      - run: python -c "import json,pathlib,yaml; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('custom_components/frigate_vision').rglob('*.json')]; yaml.safe_load(pathlib.Path('custom_components/frigate_vision/services.yaml').read_text(encoding='utf-8'))"
      - run: python -c "from pathlib import Path; from homeassistant.util.yaml.loader import load_yaml; load_yaml(Path('blueprints/automation/frigate_vision/activity_notification.yaml'))"
